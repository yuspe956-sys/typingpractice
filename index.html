<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注音與語詞輸入測驗系統</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #2c3e50; }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /* 選單與按鈕 */
        .menu { margin-bottom: 20px; }
        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            transition: 0.3s;
        }
        button:hover { background-color: #2980b9; }
        .btn-active { background-color: #e74c3c !important; }
        
        /* 遊戲區域 */
        #game-area { display: none; margin-top: 20px; }
        .question-box {
            font-size: 48px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            padding: 20px;
            background: #ecf0f1;
            border-radius: 10px;
        }
        .progress {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        
        /* 輸入歷程與提示 */
        .history-box {
            font-size: 24px;
            color: #e67e22;
            min-height: 40px;
            margin: 15px 0;
            letter-spacing: 2px;
        }
        .instruction {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* 虛擬鍵盤 */
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 20px;
            align-items: center;
        }
        .key-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        .key {
            width: 40px;
            height: 40px;
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        /* 標示聲調按鍵 */
        .key-tone {
            background-color: #f39c12;
            color: white;
            border-color: #e67e22;
        }
        .key-space {
            width: 250px;
            background-color: #f39c12;
            color: white;
        }
        .tone-label { font-size: 10px; opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 注音與語詞輸入測驗</h1>
    
    <div class="menu" id="main-menu">
        <h3>選擇測驗類型</h3>
        <div>
            <p>【注音符號練習】</p>
            <button onclick="startGame('bopomofo', 'initials')">聲母</button>
            <button onclick="startGame('bopomofo', 'finals')">韻母</button>
            <button onclick="startGame('bopomofo', 'tones')">聲調</button>
            <button onclick="startGame('bopomofo', 'all')">全部混合</button>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <div>
            <p>【國語語詞練習 (千字題庫)】</p>
            <button onclick="startGame('vocab', 'low')">低年級 (一、二)</button>
            <button onclick="startGame('vocab', 'mid')">中年級 (三、四)</button>
            <button onclick="startGame('vocab', 'high')">高年級 (五、六)</button>
        </div>
    </div>

    <div id="game-area">
        <div class="progress" id="progress-text">第 1 / 10 題</div>
        <div class="question-box" id="question-display">題目</div>
        
        <div class="instruction">請直接使用鍵盤輸入，系統會自動比對。</div>
        <div class="history-box" id="input-history">目前輸入：</div>
        
        <button onclick="resetGame()" style="background-color: #95a5a6;">返回主選單</button>

        <!-- 虛擬鍵盤 (主要用來視覺提示聲調位置) -->
        <div class="keyboard" id="virtual-keyboard">
            <div class="key-row">
                <div class="key">1</div>
                <div class="key">2</div>
                <div class="key key-tone">3<br><span class="tone-label">三聲ˇ</span></div>
                <div class="key key-tone">4<br><span class="tone-label">四聲ˋ</span></div>
                <div class="key">5</div>
                <div class="key key-tone">6<br><span class="tone-label">二聲ˊ</span></div>
                <div class="key key-tone">7<br><span class="tone-label">輕聲˙</span></div>
                <div class="key">8</div>
                <div class="key">9</div>
                <div class="key">0</div>
            </div>
            <div class="key-row">
                <div class="key key-space key-tone">空白鍵 (Space)<br><span class="tone-label">一聲</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. 題庫設定區域 (請在此擴充您的千字題庫)
    // ==========================================
    
    // 注音題庫 (已完整建置)
    const bopomofoBank = {
        initials: ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ'],
        finals: ['ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ','ㄧ','ㄨ','ㄩ'],
        tones: ['一聲', 'ˊ', 'ˇ', 'ˋ', '˙']
    };
    // 建立「全部」陣列
    bopomofoBank.all = [...bopomofoBank.initials, ...bopomofoBank.finals, ...bopomofoBank.tones];

    // 語詞題庫 (預設為範例，請將您的 1000+ 語詞直接覆蓋至對應陣列中)
    // 您可以將陣列擴充到 1000, 2000 甚至更多，系統只會隨機抽 10 題。
    const vocabBank = {
        low: ['蘋果', '香蕉', '學校', '老師', '同學', '快樂', '小狗', '天空', '白雲', '早安', '公園', '氣球', '鉛筆', '大樹', '花朵'], // 請在此填入 1000+ 低年級語詞
        mid: ['圖書館', '腳踏車', '動物園', '運動會', '健康', '合作', '自然', '閱讀', '數學', '勤奮', '風景', '禮貌', '誠實', '溫暖', '勇敢'], // 請在此填入 1000+ 中年級語詞
        high: ['微積分', '環境保護', '資訊科技', '民主自由', '國際觀', '負責任', '創造力', '邏輯', '實驗室', '大腦', '語言', '發展', '探究', '實踐', '多元'] // 請在此填入 1000+ 高年級語詞
    };

    // 聲調按鍵對應表 (依照您的需求)
    const toneMapping = {
        ' ': '一聲',
        '6': 'ˊ',
        '3': 'ˇ',
        '4': 'ˋ',
        '7': '˙'
    };

    // ==========================================
    // 2. 遊戲狀態與邏輯
    // ==========================================
    let currentQuestions = [];
    let currentIndex = 0;
    let currentMode = ''; 
    let currentLevel = '';
    let currentInput = '';
    let expectingTone = false; // 判斷是否正在等待輸入聲調

    // 打亂陣列 (Fisher-Yates Shuffle) 並抽出 10 題不重複
    function getRandomQuestions(sourceArray, count = 10) {
        let shuffled = [...sourceArray];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        // 如果題庫少於 10 題，就取題庫最大數量
        return shuffled.slice(0, Math.min(count, shuffled.length));
    }

    function startGame(mode, level) {
        currentMode = mode;
        currentLevel = level;
        currentInput = '';
        expectingTone = false;

        // 根據模式取得 10 題隨機題目
        if (mode === 'bopomofo') {
            currentQuestions = getRandomQuestions(bopomofoBank[level], 10);
            expectingTone = (level === 'tones' || level === 'all'); // 如果是考聲調，啟用特殊的監聽
        } else if (mode === 'vocab') {
            currentQuestions = getRandomQuestions(vocabBank[level], 10);
            expectingTone = false; // 語詞模式使用系統預設輸入法即可
        }

        currentIndex = 0;
        
        // 切換畫面
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        
        // 針對非聲調/注音測驗隱藏鍵盤提示以保持畫面簡潔
        if(mode === 'vocab') {
            document.getElementById('virtual-keyboard').style.display = 'none';
        } else {
            document.getElementById('virtual-keyboard').style.display = 'flex';
        }

        updateUI();
        
        // 加入全域按鍵監聽
        document.addEventListener('keydown', handleKeyPress);
    }

    function updateUI() {
        if (currentIndex >= currentQuestions.length) {
            finishGame();
            return;
        }
        document.getElementById('progress-text').innerText = `第 ${currentIndex + 1} / ${currentQuestions.length} 題`;
        document.getElementById('question-display').innerText = currentQuestions[currentIndex];
        document.getElementById('input-history').innerText = `目前輸入：${currentInput}`;
    }

    // 處理使用者按鍵輸入 (歷程與比對)
    function handleKeyPress(e) {
        // 忽略功能鍵
        if (['Shift', 'Control', 'Alt', 'Meta', 'Enter', 'Tab', 'Backspace'].includes(e.key)) {
            if (e.key === 'Backspace') {
                currentInput = currentInput.slice(0, -1);
                updateUI();
            }
            return;
        }

        let inputChar = e.key;

        // 【特殊規則】如果目前題目是「聲調」或「全部」，攔截特定數字與空白鍵轉換為聲調符號
        if (currentMode === 'bopomofo') {
            if (toneMapping[inputChar] !== undefined) {
                // 防止空白鍵捲動網頁
                if (inputChar === ' ') e.preventDefault(); 
                inputChar = toneMapping[inputChar];
            }
        }

        // 更新畫面歷程
        currentInput += inputChar;
        document.getElementById('input-history').innerText = `目前輸入：${currentInput}`;

        // 檢查是否正確
        checkAnswer();
    }

    function checkAnswer() {
        const currentAnswer = currentQuestions[currentIndex];
        
        // 如果輸入的最後幾個字元等於答案，或者完全一致，則過關進入下一題
        // 這樣可以支援使用者用拼音連續輸入，只要字尾出現正確語詞即算對
        if (currentInput.endsWith(currentAnswer)) {
            setTimeout(() => {
                currentIndex++;
                currentInput = ''; // 清空輸入歷程，準備下一題
                updateUI();
            }, 300); // 稍微延遲 0.3 秒讓使用者看到輸入成功的歷程
        }
    }

    function finishGame() {
        document.getElementById('question-display').innerText = "🎉 恭喜完成本局測驗！";
        document.getElementById('input-history').innerText = "";
        document.getElementById('progress-text').innerText = "測驗結束";
        document.removeEventListener('keydown', handleKeyPress);
    }

    function resetGame() {
        document.removeEventListener('keydown', handleKeyPress);
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('main-menu').style.display = 'block';
    }
</script>

</body>
</html>
