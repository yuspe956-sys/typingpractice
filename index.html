    <title>打字練習系統</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; text-align: center; background: #f4f7f6; margin: 0; padding: 15px; }
        
        /* 頂部導覽列 */
        .nav-bar { margin-bottom: 15px; }
        .nav-btn { font-size: 16px; padding: 10px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 8px; background: #ddd; }
        .nav-btn.active { background: #007bff; color: white; }
        
        /* 控制選項 */
        .controls { margin-bottom: 20px; font-size: 16px; }
        .controls select, .controls label { margin: 0 5px; padding: 5px; }

        /* 題目顯示區 */
        .display-area { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; display: inline-block; min-width: 60%; }
        #target-word { font-size: 50px; font-weight: bold; margin-right: 15px; }
        .speaker-btn { font-size: 28px; cursor: pointer; background: none; border: none; vertical-align: middle; }

        /* 歷程顯示區 */
        .history-area { font-size: 28px; color: #007bff; min-height: 40px; margin-bottom: 15px; letter-spacing: 4px; font-weight: bold; }

        /* 虛擬鍵盤 (因應平板尺寸優化) */
        .keyboard { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 900px; margin: 0 auto;}
        .key-row { display: flex; gap: 4px; justify-content: center; width: 100%; }
        .key { 
            flex: 1; max-width: 65px; height: 55px; background: white; border-radius: 6px; 
            border: 1px solid #ccc; box-shadow: 0 3px #aaa;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 18px; user-select: none; cursor: pointer;
        }
        .key:active { transform: translateY(3px); box-shadow: 0 0 #aaa; }
        
        /* 空白鍵特別處理 */
        .key.space { flex: none; width: 50%; max-width: 400px; flex-direction: row; font-size: 20px; gap: 10px;}
        
        /* 鍵盤顯示切換控制 */
        .show-zh .en { display: none; }
        .show-en .zh { display: none; }
        /* 當全部顯示時，稍微調整字體大小以免太擠 */
        .show-all .en { font-size: 12px; color: #666; margin-bottom: 2px;}
        .show-all .zh { font-size: 18px; font-weight: bold;}
        .show-zh .zh { font-size: 22px; font-weight: bold;}
        .show-en .en { font-size: 22px; font-weight: bold; color: black;}
    </style>
</head>

        // 頁面載入時初始化
        window.onload = function() {
            switchMode('bopomofo');
        };

        function switchMode(mode) {
            currentMode = mode;
            inputHistory = [];
            document.getElementById('history-area').innerText = '';
            
            // 更新上方導覽列按鈕樣式
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            // 找出點擊的是哪個按鈕並加上 active
            let buttons = document.querySelectorAll('.nav-btn');
            if(mode === 'bopomofo') buttons[0].classList.add('active');
            if(mode === 'chinese') buttons[1].classList.add('active');
            if(mode === 'english') buttons[2].classList.add('active');

            // 只有中文模式才顯示難度選單
            document.getElementById('difficulty-selector').style.display = (mode === 'chinese') ? 'inline' : 'none';

            // 切換時自動切換建議的鍵盤視角
            let kbView = document.getElementById('keyboard-view');
            if(mode === 'english') {
                kbView.value = 'show-en';
            } else if(mode === 'bopomofo' || mode === 'chinese') {
                kbView.value = 'show-zh';
            }
            document.body.className = kbView.value;

            nextQuestion();
        }

        // 下一題
        function nextQuestion() {
            let target = "";
            if (currentMode === 'bopomofo') {
                target = mockData.bopomofo[Math.floor(Math.random() * mockData.bopomofo.length)];
            } else if (currentMode === 'chinese') {
                let lvl = document.getElementById('level').value;
                target = mockData.chinese[lvl][Math.floor(Math.random() * mockData.chinese[lvl].length)];
            } else if (currentMode === 'english') {
                target = mockData.english[Math.floor(Math.random() * mockData.english.length)];
            }
            
            document.getElementById('target-word').innerText = target;
            inputHistory = [];
            document.getElementById('history-area').innerText = '';

            // 如果勾選報讀，就發出聲音
            if (document.getElementById('auto-read').checked) {
                setTimeout(speakTarget, 500); // 延遲半秒發音，避免切換太快
            }
        }

        // 清除輸入歷程
        function clearHistory() {
            inputHistory = [];
            document.getElementById('history-area').innerText = '';
        }

        // 語音報讀功能
        function speakTarget() {
            let text = document.getElementById('target-word').innerText;
            
            // 處理注音聲調特例
            if(text === '空白鍵') text = '一聲';
            if(text === 'ˊ') text = '二聲';
            if(text === 'ˇ') text = '三聲';
            if(text === 'ˋ') text = '四聲';
            if(text === '˙') text = '輕聲';

            // 確保停止前一個發音
            window.speechSynthesis.cancel(); 
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = (currentMode === 'english') ? 'en-US' : 'zh-TW';
            msg.rate = 0.85; // 稍慢的語速
            window.speechSynthesis.speak(msg);
        }

        // 按鍵點擊事件
        function typeKey(zhChar, enChar) {
            let viewMode = document.getElementById('keyboard-view').value;
            let typed = zhChar; // 預設紀錄注音

            // 若在英文模式，或鍵盤切換為「僅英文」，就記錄英文字母
            if (currentMode === 'english' || viewMode === 'show-en') {
                typed = enChar;
            }

            inputHistory.push(typed);
            document.getElementById('history-area').innerText = inputHistory.join(' ');
        }
